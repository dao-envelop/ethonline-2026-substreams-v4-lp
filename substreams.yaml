specVersion: v0.1.0

package:
  name: envelop_lp_v4
  version: v0.2.1
  url: https://github.com/dao-envelop/ethonline-2026-substreams-v4-lp
  description: Typed events, operators and position deltas for Uniswap v4 LP managers

network: mainnet

# The sink protos come from the official packages rather than being redefined here: the wire format is
# the contract with the sink, and a hand-copied message that drifts by one field number produces a
# pipeline that builds and writes rubbish.
imports:
  # Only the DatabaseChanges protos are imported. The sink Service type is already inside the substreams
  # CLI (the SQL sink ships with it since v1.20), and importing the protodefs package as well makes the
  # two definitions collide: "name conflict over sf.substreams.sink.sql.v1.Service".
  database: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v4.0.0/substreams-sink-database-changes-v4.0.0.spkg
  # The entity protos for graph_out, from the same source, for the same reason. Rust bindings for these
  # are generated locally from proto/sf/... — that copy exists only because the helper crate cannot be
  # linked here (see the file's header); the descriptor a consumer reads comes from this import.
  entity: https://github.com/streamingfast/substreams-sink-entity-changes/releases/download/v1.3.2/substreams-sink-entity-changes-v1.3.2.spkg

protobuf:
  files:
    - envelop/lp/v1/lp.proto
  importPaths:
    - ./proto
  excludePaths: [sf/substreams, google]

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/envelop_lp_v4.wasm

params:
  # LPManagerFactory for this network. Override per chain with `-p map_raw_events=0x...`.
  # 1 mainnet   0x75e5d72D6971221b6332AaE8F59759d4Ba366dd0
  # 130 unichain 0x62D51DFF0c264a5aF8452A10789E4C98b7413A3c
  # 8453 base    0x7A3c8F45b809078da58d17fb6Cd059334622838F
  # 42161 arbitrum 0x8A56c6be755aC385395E96234b553DB1B9B06bEa
  map_raw_events: "0x75e5d72d6971221b6332aae8f59759d4ba366dd0"

modules:
  - name: map_raw_events
    kind: map
    # The factory's first deployment on this network. Pinning it to protocol genesis would turn every
    # cold start into a full-chain backfill; the store has to catch up from initialBlock each time.
    initialBlock: 25580292
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:envelop.lp.v1.Events

  - name: store_managers
    kind: store
    updatePolicy: set_if_not_exists
    valueType: string
    initialBlock: 25580292
    inputs:
      - map: map_raw_events

  - name: map_events
    kind: map
    initialBlock: 25580292
    inputs:
      - map: map_raw_events
      - store: store_managers
        mode: get
    output:
      type: proto:envelop.lp.v1.Events

  - name: map_positions
    kind: map
    initialBlock: 25580292
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_managers
        mode: get
    output:
      type: proto:envelop.lp.v1.PositionDeltas

  - name: index_events
    kind: blockIndex
    initialBlock: 25580292
    inputs:
      - map: map_raw_events
    output:
      type: proto:sf.substreams.index.v1.Keys

  # ─── the subgraph side ───
  # Two stores so a subgraph can answer "what does this position hold" without the consumer folding
  # every delta itself: one signed running sum per position plus its two fee counters, and one
  # write-once record of where and when the position began.

  - name: store_position_totals
    kind: store
    updatePolicy: add
    valueType: bigint
    initialBlock: 25580292
    inputs:
      - map: map_events
      - map: map_positions

  - name: store_position_open
    kind: store
    updatePolicy: set_if_not_exists
    valueType: string
    initialBlock: 25580292
    inputs:
      - map: map_positions

  - name: db_out
    kind: map
    initialBlock: 25580292
    inputs:
      - map: map_events
      - map: map_positions
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: graph_out
    kind: map
    initialBlock: 25580292
    inputs:
      - map: map_events
      - map: map_positions
      - store: store_position_totals
        mode: get
      - store: store_position_open
        mode: get
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges

sink:
  module: db_out
  # sf.substreams.sink.sql.v1.Service is the deprecated spelling; this is the current one.
  type: sf.substreams.sink.sql.service.v1.Service
  config:
    schema: ./schema.sql
    # Inert for the CLI — the dialect comes from the DSN — but it is what a hosted deployment reads.
    engine: postgres

# Per-network overrides: same modules, different factory and different first block. `--network <name>`
# selects one. Keeping this in the manifest rather than in five copies of it is the whole point — the
# package is about a class of contracts, not about one deployment.
networks:
  mainnet:
    initialBlock:
      map_raw_events: 25580292
      store_managers: 25580292
      map_events: 25580292
      map_positions: 25580292
      index_events: 25580292
      db_out: 25580292
      store_position_totals: 25580292
      store_position_open: 25580292
      graph_out: 25580292
    params:
      map_raw_events: "0x75e5d72d6971221b6332aae8f59759d4ba366dd0"
  arbitrum-one:
    initialBlock:
      map_raw_events: 486143228
      store_managers: 486143228
      map_events: 486143228
      map_positions: 486143228
      index_events: 486143228
      db_out: 486143228
      store_position_totals: 486143228
      store_position_open: 486143228
      graph_out: 486143228
    params:
      map_raw_events: "0x8a56c6be755ac385395e96234b553db1b9b06bea"
  base:
    initialBlock:
      map_raw_events: 48918859
      store_managers: 48918859
      map_events: 48918859
      map_positions: 48918859
      index_events: 48918859
      db_out: 48918859
      store_position_totals: 48918859
      store_position_open: 48918859
      graph_out: 48918859
    params:
      map_raw_events: "0x7a3c8f45b809078da58d17fb6cd059334622838f"
  # Unichain is indexed from a recent block, not from the factory's. The gap between the factory
  # (53,877,933) and the head is 4.2M blocks, and every module's store has to catch up across it before
  # a single row is written — which is more than a free tier's monthly block quota all by itself, for
  # history the Envelop oracle already serves. "Follow the head" is expressed here, in initialBlock, and
  # not with `-s`: a start flag does not stop the stores from backfilling behind it.
  # Consequence, and it is deliberate: managers created before this block are not in the registry, so
  # this deployment answers for managers created from 8 September 2026 onward.
  unichain:
    initialBlock:
      map_raw_events: 58100000
      store_managers: 58100000
      map_events: 58100000
      map_positions: 58100000
      index_events: 58100000
      db_out: 58100000
      store_position_totals: 58100000
      store_position_open: 58100000
      graph_out: 58100000
    params:
      map_raw_events: "0x62d51dff0c264a5af8452a10789e4c98b7413a3c"
