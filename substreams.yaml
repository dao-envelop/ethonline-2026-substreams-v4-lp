specVersion: v0.1.0

package:
  name: envelop_lp_v4
  version: v0.2.4
  url: https://github.com/dao-envelop/ethonline-2026-substreams-v4-lp
  description: Typed events, operators and position deltas for Uniswap v4 LP managers

network: mainnet

# The sink protos come from the official packages rather than being redefined here: the wire format is
# the contract with the sink, and a hand-copied message that drifts by one field number produces a
# pipeline that builds and writes rubbish.
imports:
  # Only the DatabaseChanges protos are imported. The sink Service type is already inside the substreams
  # CLI (the SQL sink ships with it since v1.20), and importing the protodefs package as well makes the
  # two definitions collide: "name conflict over sf.substreams.sink.sql.v1.Service".
  database: https://github.com/streamingfast/substreams-sink-database-changes/releases/download/v4.0.0/substreams-sink-database-changes-v4.0.0.spkg
  # The entity protos for graph_out, from the same source, for the same reason. Rust bindings for these
  # are generated locally from proto/sf/... — that copy exists only because the helper crate cannot be
  # linked here (see the file's header); the descriptor a consumer reads comes from this import.
  entity: https://github.com/streamingfast/substreams-sink-entity-changes/releases/download/v1.3.2/substreams-sink-entity-changes-v1.3.2.spkg
  # A published third-party package, used for what it is good at rather than for the sake of using one:
  # `eth:index_events` keys every block by the event signatures and contract addresses it contains, so
  # the two modules below can be skipped entirely on blocks that hold none of ours. Billing is per block
  # processed, and these managers are active in a tiny fraction of blocks — this is the difference
  # between a backfill that fits a free tier and one that does not.
  eth: https://spkg.io/v1/packages/ethereum-common/v0.3.3

protobuf:
  files:
    - envelop/lp/v1/lp.proto
  importPaths:
    - ./proto
  excludePaths: [sf/substreams, google]

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/envelop_lp_v4.wasm

params:
  # LPManagerFactory for this network. Override per chain with `-p map_raw_events=0x...`.
  # 1 mainnet   0x75e5d72D6971221b6332AaE8F59759d4Ba366dd0
  # 130 unichain 0x62D51DFF0c264a5aF8452A10789E4C98b7413A3c
  # 8453 base    0x7A3c8F45b809078da58d17fb6Cd059334622838F
  # 42161 arbitrum 0x8A56c6be755aC385395E96234b553DB1B9B06bEa
  map_raw_events: "0x75e5d72d6971221b6332aae8f59759d4ba366dd0"

modules:
  - name: map_raw_events
    kind: map
    # Every signature this module decodes. A superset is safe — anything extra is dropped in the map —
    # but a missing one would silently skip blocks that hold our data, so this list is exhaustive.
    blockFilter:
      module: eth:index_events
      query:
        string: "evt_sig:0x8dc66cafb77b325538c856bfa5892b31ca7305adfa48f6a09e030e261cda0795 ||
            evt_sig:0x10f27652c1015195ca7e6bc9b4c724cbf18e91c42117d92124703a3f49bb240f ||
            evt_sig:0x1a594081ae893ab78e67d9b9e843547318164322d32c65369d78a96172d9dc8f ||
            evt_sig:0x6536690106168bdf4ba72c128a053d817999b1db90cae23f139b293bf862cb75 ||
            evt_sig:0x60a0c13c5aa0acfe5cd0c4f3ac6b9fe2742094a559183932b66e20108fc2be19 ||
            evt_sig:0xed257351a771f42116f007ab30cebdb3c5ad1c728130678f0366b3ac5bbc9289 ||
            evt_sig:0x28df9956e36f6b2ddfc82adc08628624a1376919a00acc6e194e283705acf843 ||
            evt_sig:0x4257047a82edf43bf1bef92176ac66a3c63ee849651929eabf6dbd8492817ac5 ||
            evt_sig:0x78ac3cb2ba67a1f6276bb278a678e4cb5717b5deaf2a8f91ba328d42befcf201 ||
            evt_sig:0xe55a95d6d9c03c5e2d9639fa315b5f3852a2965a8312dcd8137079206ebae6b4 ||
            evt_sig:0xc1c8805cfada52b0ae87fe6009f4a465d8a292e9c00049973b9c28946fb22153"
    # The factory's first deployment on this network. Pinning it to protocol genesis would turn every
    # cold start into a full-chain backfill; the store has to catch up from initialBlock each time.
    initialBlock: 25580292
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:envelop.lp.v1.Events

  - name: store_managers
    kind: store
    updatePolicy: set_if_not_exists
    valueType: string
    initialBlock: 25580292
    inputs:
      - map: map_raw_events

  - name: map_events
    kind: map
    initialBlock: 25580292
    inputs:
      - map: map_raw_events
      - store: store_managers
        mode: get
    output:
      type: proto:envelop.lp.v1.Events

  - name: map_positions
    kind: map
    # Uniswap's own ModifyLiquidity. Whether the sender is one of our managers is decided in the map,
    # against the registry; the index only says whether the block is worth opening at all.
    blockFilter:
      module: eth:index_events
      query:
        string: "evt_sig:0xf208f4912782fd25c7f114ca3723a2d5dd6f3bcc3ac8db5af63baa85f711d5ec"
    initialBlock: 25580292
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_managers
        mode: get
    output:
      type: proto:envelop.lp.v1.PositionDeltas

  - name: index_events
    kind: blockIndex
    initialBlock: 25580292
    inputs:
      - map: map_raw_events
    output:
      type: proto:sf.substreams.index.v1.Keys

  # ─── the subgraph side ───
  # Two stores so a subgraph can answer "what does this position hold" without the consumer folding
  # every delta itself: one signed running sum per position plus its two fee counters, and one
  # write-once record of where and when the position began.

  - name: store_position_totals
    kind: store
    updatePolicy: add
    valueType: bigint
    initialBlock: 25580292
    inputs:
      - map: map_events
      - map: map_positions

  - name: store_position_open
    kind: store
    updatePolicy: set_if_not_exists
    valueType: string
    initialBlock: 25580292
    inputs:
      - map: map_positions

  - name: db_out
    kind: map
    initialBlock: 25580292
    inputs:
      - map: map_events
      - map: map_positions
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: graph_out
    kind: map
    initialBlock: 25580292
    inputs:
      - map: map_events
      - map: map_positions
      - store: store_position_totals
        mode: get
      - store: store_position_open
        mode: get
    output:
      type: proto:sf.substreams.sink.entity.v1.EntityChanges

sink:
  module: db_out
  # sf.substreams.sink.sql.v1.Service is the deprecated spelling; this is the current one.
  type: sf.substreams.sink.sql.service.v1.Service
  config:
    schema: ./schema.sql
    # Inert for the CLI — the dialect comes from the DSN — but it is what a hosted deployment reads.
    engine: postgres

# Per-network overrides: same modules, different factory and different first block. `--network <name>`
# selects one. Keeping this in the manifest rather than in five copies of it is the whole point — the
# package is about a class of contracts, not about one deployment.
networks:
  mainnet:
    initialBlock:
      map_raw_events: 25580292
      store_managers: 25580292
      map_events: 25580292
      map_positions: 25580292
      index_events: 25580292
      db_out: 25580292
      store_position_totals: 25580292
      store_position_open: 25580292
      graph_out: 25580292
    params:
      map_raw_events: "0x75e5d72d6971221b6332aae8f59759d4ba366dd0"
  arbitrum-one:
    initialBlock:
      map_raw_events: 486143228
      store_managers: 486143228
      map_events: 486143228
      map_positions: 486143228
      index_events: 486143228
      db_out: 486143228
      store_position_totals: 486143228
      store_position_open: 486143228
      graph_out: 486143228
    params:
      map_raw_events: "0x8a56c6be755ac385395e96234b553db1b9b06bea"
  base:
    initialBlock:
      map_raw_events: 48918859
      store_managers: 48918859
      map_events: 48918859
      map_positions: 48918859
      index_events: 48918859
      db_out: 48918859
      store_position_totals: 48918859
      store_position_open: 48918859
      graph_out: 48918859
    params:
      map_raw_events: "0x7a3c8f45b809078da58d17fb6cd059334622838f"
  # A recent block, not the factory's, and this is a standing decision rather than a tuning knob.
  #
  # The store backfills from initialBlock before a single row is written, and a start flag does not
  # change that — so where a chain is indexed from is decided here. On this chain the factory is 4.2M
  # one-second blocks behind the head, and the filter above does not make that free: measured on a
  # running sink it processes ~15% of the blocks in scope, not the ~2% a single-stage `substreams run`
  # suggests (the sink counts both stages, and 1000-block segments are pulled in whole by one
  # interesting block). That puts this chain's full history at ~1.27M processed blocks — more than half
  # of a free tier's monthly quota, spent on history the Envelop oracle already serves.
  #
  # So: 58,125,000, just under the manager created on 2026-09-08 for the demo. Older managers on this
  # chain answer from the oracle through lp-insight's cascade, which is what the cascade is for.
  unichain:
    initialBlock:
      map_raw_events: 58125000
      store_managers: 58125000
      map_events: 58125000
      map_positions: 58125000
      index_events: 58125000
      db_out: 58125000
      store_position_totals: 58125000
      store_position_open: 58125000
      graph_out: 58125000
    params:
      map_raw_events: "0x62d51dff0c264a5af8452a10789e4c98b7413a3c"
