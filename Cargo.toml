[workspace]

[package]
name = "envelop_lp_v4"
version = "0.2.0"
edition = "2021"
description = "Substreams package for Uniswap v4 LP managers: typed events, operators and position deltas"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7"
substreams-ethereum = "0.11"
substreams-database-change = "4"
prost = "0.13"
prost-types = "0.13"
hex = "0.4"
ethabi = "18"

[build-dependencies]
substreams-ethereum = "0.11"
prost-build = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
